services:
  backend:
    build: .
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: parola
      POSTGRES_DB: issue-tracker-api
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d issue-tracker-api"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: